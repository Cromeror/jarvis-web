<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Jarvis Flow UI</title>

    <!-- LAS TRES FAMILIAS del template, que tokens.css nombra en --sw-font-*:
         Inter para texto (--sw-font), JetBrains Mono para lo tabular y el
         código (--sw-font-mono), y Raleway para la voz de la marca
         (--sw-font-display) — el título de entrar, sus rótulos y sus campos.

         RALEWAY VA CON EL PESO 100, que el index.html del template no pide: las
         frases tipeadas de la pantalla de entrar son finas (--sw-w-thin: 100), y
         sin ese peso el navegador lo simula adelgazando el 500 — se ve distinto
         y salta cuando la fuente real termina de cargar. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Raleway:wght@100;500;600&display=swap" />

    <script>
      /* Antes de la primera pintura. Si la elección de tema se estampa desde
         React, se ve un parpadeo del tema del sistema mientras monta. Es lo
         único que justifica un script en el <head>. Sin valor guardado queda
         en auto, que tokens.css resuelve por prefers-color-scheme. */
      try {
        var t = localStorage.getItem('sw.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* sin storage: arranca en auto */ }
    </script>

    <style>
      /* EL MODELO DE ALTURA DEL TEMPLATE, tal cual su index.html: la página no
         scrollea nunca. El chasis ocupa la ventana y lo que scrollea es la zona
         del módulo, adentro. */
      html, body { height: 100%; overflow: hidden; }
      /* LO ÚNICO QUE EL TEMPLATE NO NECESITA: él escribe el chasis directo en el
         <body>; acá React monta en #root, que queda en el medio. Sin altura
         propia, el `height: 100%` de .sw-side mide contra una caja colapsada y
         el layout se desarma. */
      #root {
        height: 100%;
        /* flow-root, y NO es decorativo: sin esto el `margin: 8px` de .sw-side
           COLAPSA con el de #root en vez de separar (CSS2.1 §8.3.1 — #root no
           tiene border-top ni padding-top y no abre contexto de formato propio),
           así que el chasis quedaba pegado al borde de la ventana. El margen
           estaba puesto y medía 8px en el box model: lo que faltaba era que
           #root lo contuviera.

           Se descartó `overflow:hidden` —#root tiene que poder dejar salir
           popovers y globos— y también el border/padding de 1px, que tapa el
           síntoma en vez de arreglar la causa. */
        display: flow-root;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
